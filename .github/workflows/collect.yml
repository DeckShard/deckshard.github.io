name: Raccolta dati e pubblicazione

# Ogni notte: catalogo + immagini nuove + prezzi Cardmarket, poi pubblica il
# sito (app + dati + immagini) su GitHub Pages. Parte anche a mano e a ogni
# modifica dei file dell'app.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "public/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Sveglia del database
        run: |
          curl -sS -X POST "https://uxbtwurhsujzyzvsvghm.supabase.co/rest/v1/rpc/ping" -H "apikey: sb_publishable__IATo8hKZDNZMp9_jESfAQ_Ll6PwNqF" -H "Content-Type: application/json" -d "{}" || true
      - name: Raccolta
        run: python collect.py
      - name: Commit dei dati
        run: |
          git config user.name "night-city-deck-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/ public/
          git commit -m "Dati del $(date -u +%F)" || echo "nessuna modifica"
          git push
      - name: Costruzione del sito
        run: |
          rm -rf site && mkdir -p site/img site/.well-known
          cp *.html *.js *.css *.webmanifest *.svg *.png site/
          cp assetlinks.json site/.well-known/assetlinks.json
          cp public/*.json site/
          cp -r data/img/. site/img/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
